<!DOCTYPE html>
<html lang="fr"></html>

<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <link rel="stylesheet" type="text/css" href="css/contact.css">
    <script src="JS/script.js"></script>
</head>

<body>
    <form action="envoi.html">
    <main>
        <fieldset>
            <legend>Vos coordonées</legend>
                
                <label for="nom">Nom :</label>
                <input type="text" id="nom" name="nom" required placeholder="Votre nom" size="20" minlength="2" maxlength="30">
                <div class="error" id="nom_error"></div>
                
                <label for="prenom">Prénom :</label>
                <input type="text" id="prenom" name="prenom" required placeholder="Votre prénom" size="20" minlength="2" maxlength="30">
                <div class="error" id="prenom_error"></div>
                
                <label for="email">Email :</label>
                <input type="email" id="email" name="email" required placeholder="exemple@domaine.com" size="20" minlength="2" maxlength="50">
                <div class="error" id="email_error"></div>
                
                <label for="tel">Téléphone :</label>
                <input type="text" id="tel" name="tel" required placeholder="06.12.34.56.78" size="20" pattern="[0-9]{2}.[0-9]{2}.[0-9]{2}.[0-9]{2}.[0-9]{2}">
                <div class="error" id="tel_error"></div>
                
        </fieldset>
        <div id="sujet">
            <label for="sujet">Sujet : </label>
            <select id="liste" name="lsite_deroulante">
                <option value="Info">Information</option>
                <option value="RDV">Rendez-vous</option>
                <option value="Autre">Autre</option>
            </select>
        </div>
        <div id="message">
            <label for="message"></label>
            <textarea id="message" placeholder="Écrivez votre message ici..." minlength="20" maxlength="500" required></textarea>
            <div class="error" id="msg_error"></div>
        </div>

    </main>
    <footer>
        <div id="croix">
            <input type="checkbox" id="vendre ame" name="accept" required>
            <label for="vendre ame">J'accepte que mes données soient utilisées pour ce contact</label>
            <div class="error" id="ame_error"></div>
        </div>
        <div id="envoi">
            <input type="submit" id="boutton" name="boutton" formaction="envoi.html">
        </div>
        <div id="reset">
            <input type="reset" id="boutton" name="boutton">
        </div>
    </footer>
    </form>
</body>
