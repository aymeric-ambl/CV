<!DOCTYPE html>
<html lang="fr"></html>

<head>
    <meta charset="UTF-8">
    <title>Contact</title>
</head>

<body>
    <form action="envoi.html">
    <main>
        <fieldset>
            <legend>Vos coordonées</legend>
            
                <div id="nom">
                    <label for="nom">Nom :</label>
                    <input type="text" id="nom" name="nom" required size="20" minlength="2" maxlength="30">
                </div>
                <div id="prenom">
                    <label for="prenom">Prénom :</label>
                    <input type="text" id="prenom" name="prenom" required size="20" minlength="2" maxlength="30">
                </div>
                <div id="email">
                    <label for="email">Email :</label>
                    <input type="email" id="email" name="email" required size="20" minlength="2" maxlength="50">
                </div>
                <div id="tel">
                    <label for="tel">Téléphone :</label>
                    <input type="text" id="tel" name="tel" required size="20" pattern="[0-9]{2}.[0-9]{2}.[0-9]{2}.[0-9]{2}.[0-9]{2}">
                </div>
            
        </fieldset>
        <div id="sujet">
            <label for="sujet">Sujet : </label>
            <select id="liste" name="lsite_deroulante">
                <option value="Info">Information</option>
                <option value="RDV">Rendez-vous</option>
                <option value="Autre">Autre</option>
            </select>
        </div>
        <div>
            <label for="message"></label>
            <textarea id="message" required></textarea>
        </div>

    </main>
    <footer>
        <div id="croix">
            <input type="checkbox" id="vendre ame" name="accept" required>
            <label for="vendre ame">J'accepte que mes données soient utilisées pour ce contact</label>
        </div>
        <div id="envoi">
            <input type="submit" id="boutton" name="boutton" formaction="envoi.html">
        </div>
        <div id="reset">
            <input type="reset" id="boutton" name="boutton">
        </div>
    </footer>
    </form>
</body>
